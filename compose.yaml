services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community_local
      POSTGRES_DB: community
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - community_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  community_postgres:
